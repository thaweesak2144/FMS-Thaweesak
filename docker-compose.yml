services:
  # ══════════════════════════════════════════════════════════
  # Database Service (PostgreSQL 17)
  # ══════════════════════════════════════════════════════════
  db:
    image: postgres:17-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Passw0rd!vibe}
      POSTGRES_DB: ${DB_NAME:-ums_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/database-backup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_HOST_PORT:-5433}:5432" # Use 5433 to avoid conflict if host already has postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ums_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ══════════════════════════════════════════════════════════
  # Next.js Application Service (Standalone Production)
  # ══════════════════════════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fms-web-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Passw0rd!vibe}@db:5432/${DB_NAME:-ums_prod}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-changeme_super_secret_auth_token_for_production}
      AUTH_TRUST_HOST: "true"
      APP_URL: ${APP_URL:-http://localhost:3010}
      PORT: 3010
      HOSTNAME: "0.0.0.0"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${APP_HOST_PORT:-3011}:3010"
    volumes:
      # Persistent storage for uploaded logos and documents
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # ══════════════════════════════════════════════════════════
  # Public HTTPS Tunnel (Cloudflare Tunnel - Method 2)
  # ══════════════════════════════════════════════════════════
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fms-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3010
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

# ══════════════════════════════════════════════════════════
# Persistent Storage Volumes
# ══════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ══════════════════════════════════════════════════════════
# Network Definition
# ══════════════════════════════════════════════════════════
networks:
  app-network:
    driver: bridge
