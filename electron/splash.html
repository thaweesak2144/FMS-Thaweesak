<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเริ่มต้นระบบ...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      text-align: center;
      padding: 32px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
    }
    .logo svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .loader {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      position: absolute;
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes loading {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: -40%; }
    }
    .status {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1>ระบบบริหารจัดการองค์กร</h1>
    <p>กำลังเริ่มต้นระบบและฐานข้อมูล...</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <div class="status" id="status-text">กำลังตรวจสอบบริการเบื้องหลัง</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('status-update', (event, text) => {
      const el = document.getElementById('status-text');
      if (el) el.innerText = text;
    });
  </script>
</body>
</html>
